name: "Build"
on:
  push:
    branches: [ "*" ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CHECKOUT_REF: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'liquid' && github.event.pull_request.head.sha || github.sha }}"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ env.CHECKOUT_REF }}'
      - name: Verify checkout authority
        run: test "$(git rev-parse HEAD)" = "$CHECKOUT_REF"
      - uses: cachix/install-nix-action@v20
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Setup Cachix
        uses: cachix/cachix-action@v12
        with:
          name: wasabibinarycache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix build --print-build-logs .#all
      - run: echo OK
